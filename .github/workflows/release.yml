name: Release

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release para upload dos assets"
        required: true
        default: "v2.0"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            nome: jogo-linux
          - os: macos-latest
            nome: jogo-macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Instalar gcc e make (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc make

      - name: Compilar
        run: make

      - name: Renomear binário
        run: mv jogo ${{ matrix.nome }}

      - name: Upload para release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: ${{ matrix.nome }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
